[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: bugbear, UP: modern syntax, SIM: simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and form fields as default arguments.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette's test client announces a future move away from httpx. The
    # stack of this project is fixed on httpx, so the notice is not actionable.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
